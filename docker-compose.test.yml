services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authcore
      POSTGRES_PASSWORD: authcore
      POSTGRES_DB: authcore_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authcore"]
      interval: 3s
      timeout: 2s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025"
      - "8026:8025"
