name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authcore
          POSTGRES_PASSWORD: authcore
          POSTGRES_DB: authcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authcore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race
        env:
          DATABASE_URL: postgres://authcore:authcore@localhost:5432/authcore_test?sslmode=disable

